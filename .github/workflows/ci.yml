name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # available.lua reads GITHUB_TOKEN to avoid API rate limiting
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          # mise.toml lists dev tools for the security job; the e2e
          # matrix only needs mise itself
          install: false

      # Link the checked-out plugin so PRs test their own changes,
      # not whatever is on main
      - name: Link vibe plugin from checkout
        shell: bash
        run: |
          mise plugins link vibe "$GITHUB_WORKSPACE"

      - name: List available versions
        shell: bash
        run: |
          mise ls-remote vibe | head -10

      - name: Install vibe@latest
        shell: bash
        run: |
          mise install vibe@latest

      - name: Verify vibe installation
        shell: bash
        run: |
          mise exec vibe -- vibe --version

      # v1.x uses the pre-2.0 Windows asset naming (vibe-windows-x64.exe)
      - name: Install vibe@1.8.1 (legacy asset naming)
        shell: bash
        run: |
          mise install vibe@1.8.1

      - name: Verify vibe@1.8.1 installation
        shell: bash
        run: |
          mise exec vibe@1.8.1 -- vibe --version

  security:
    runs-on: ubuntu-latest
    env:
      # pinact --verify resolves action refs via the GitHub API
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # gitleaks scans the full git history
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: Verify pinned actions (pinact)
        run: mise exec -- pinact run --check --verify

      - name: Scan for secrets (gitleaks)
        run: mise exec -- gitleaks git --redact .
