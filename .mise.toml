# Dev tools for working on this plugin (mise install; lefthook install)
[env]
# LuaRocks 3.13.0's bootstrap fails to parse its own rockspec; pin the
# last version that installs cleanly under asdf-lua
ASDF_LUA_LUAROCKS_VERSION = "3.11.1"

[tools]
gitleaks = "8.30.1"
lefthook = "2.1.10"
lua = "5.4.7"
node = "24.18.0"
pinact = "4.1.0"
